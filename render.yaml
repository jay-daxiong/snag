# Render 免费托管配置（路线 A 的"永久免费地址"）
# 用法：把本仓库推到 GitHub → 在 render.com 用 GitHub 登录 → New Web Service → 连仓库 → 选 Free → Deploy
# Render 会自动读取 package.json，执行 npm install（本应用零依赖）后再用 startCommand 启动。
services:
  - type: web
    name: snag
    runtime: node
    plan: free            # 免费套餐：自动 HTTPS、稳定子域；空闲 15 分钟后会休眠，下次访问自动唤醒（约 30s）
    region: oregon        # 可选：singapore / frankfurt 等；免费套餐默认 oregon
    branch: master
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: "production"
      # PORT 由 Render 自动注入，无需手动设置；本应用监听 process.env.PORT 且绑定 0.0.0.0
      # 以下为可选生产配置：在 Render 控制台 Environment 里逐项添加真实值（sync:false 表示不在仓库里写死密钥）
      - key: DATABASE_URL
        sync: false          # 接 Postgres 真·持久化（Supabase/Neon 免费档的连接串）；不填则仍用本地 JSON
      - key: SNAG_WX_MCH_ID
        sync: false
      - key: SNAG_WX_APP_ID
        sync: false
      - key: SNAG_WX_SERIAL
        sync: false
      - key: SNAG_WX_PRIVATE_KEY
        sync: false
      - key: SNAG_WX_APIV3_KEY
        sync: false
      - key: SNAG_WX_PLATFORM_PUBLIC_KEY
        sync: false
      - key: SNAG_WX_NOTIFY_URL
        sync: false
      - key: SNAG_ALI_APP_ID
        sync: false
      - key: SNAG_ALI_PRIVATE_KEY
        sync: false
      - key: SNAG_ALI_PUBLIC_KEY
        sync: false
      - key: SNAG_ALI_NOTIFY_URL
        sync: false
      - key: SNAG_ADMIN_PASS
        sync: false          # 上线后务必改后台密码
      - key: SNAG_MOD_PASS
        sync: false
